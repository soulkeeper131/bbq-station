<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Грил Бистро — Поръчка за вземане</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2c211a; --cream:#f7efe3; --cream-2:#efe3d2;
    --ember:#d25a2a; --ember-dark:#b8481f; --olive:#6f7345; --gold:#d29a4e;
    --muted:rgba(54,40,30,.64); --line:rgba(70,50,35,.14);
    --glass:rgba(255,255,255,.7); --glass-2:rgba(255,255,255,.82); --glass-dark:rgba(255,255,255,.62);
    --glass-bd:rgba(255,255,255,.85); --glass-bd-dk:rgba(70,50,35,.12);
    --blur:saturate(150%) blur(16px); --shadow:0 20px 46px -22px rgba(18,11,6,.55);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Hanken Grotesk',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;
    background:#f4ead9}
  body::before{content:"";position:fixed;inset:0;z-index:-2;
    background:
      radial-gradient(60% 50% at 12% 8%, rgba(255,210,165,.85), transparent 60%),
      radial-gradient(55% 45% at 90% 6%, rgba(255,232,196,.85), transparent 60%),
      radial-gradient(60% 55% at 86% 94%, rgba(214,224,190,.7), transparent 62%),
      radial-gradient(58% 52% at 10% 96%, rgba(255,202,172,.75), transparent 60%),
      linear-gradient(140deg,#fcf5ec,#f3e8d6)}
  button{font-family:inherit}

  .demobar{position:sticky;top:0;z-index:70;background:rgba(255,255,255,.72);-webkit-backdrop-filter:var(--blur);
    backdrop-filter:var(--blur);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px;
    padding:8px 12px;font-size:12px;border-bottom:1px solid var(--glass-bd-dk)}
  .demobar b{color:var(--ember);letter-spacing:.1em;text-transform:uppercase;font-size:10.5px;margin-right:6px}
  .demobar .seg{display:flex;background:rgba(70,50,35,.08);border-radius:999px;padding:3px}
  .demobar .seg button{border:none;background:none;color:var(--ink);font-size:12px;font-weight:600;padding:6px 14px;
    border-radius:999px;cursor:pointer;opacity:.65;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:5px}
  .demobar .seg button.on{background:var(--ember);color:#fff;opacity:1}

  /* ВАЖНО: без backdrop-filter тук на мобилно — иначе .app става containing block
     за position:fixed елементите (количка/модал) и ги мести/отрязва спрямо страницата. */
  .app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;
    background:rgba(247,239,227,.7)}
  body.cart-open{overflow:hidden}

  header{position:relative;z-index:40;background:rgba(255,255,255,.66);-webkit-backdrop-filter:var(--blur);
    backdrop-filter:var(--blur);color:var(--ink);padding:16px 18px;border-bottom:1px solid var(--glass-bd-dk)}
  .brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand h1{font-family:'Fraunces',serif;font-weight:900;font-size:25px;line-height:1;letter-spacing:-.01em}
  .brand h1 .amp{color:var(--ember);font-style:italic;font-weight:500}
  .brand .sub{font-size:11.5px;color:var(--muted);margin-top:5px;letter-spacing:.02em}
  .cart-btn{background:var(--ember);color:#fff;border:none;border-radius:999px;padding:11px 16px;font-weight:700;
    font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:0 10px 22px -8px rgba(210,90,42,.7);transition:transform .15s,background .2s}
  .cart-btn:hover{background:var(--ember-dark);transform:translateY(-1px)}
  .cart-btn .count{background:#fff;color:var(--ember);border-radius:999px;min-width:20px;height:20px;
    display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;padding:0 5px}

  .layout{display:block}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 18px 4px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;border:1px solid var(--glass-bd);background:rgba(255,255,255,.42);border-radius:999px;
    padding:8px 15px;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;transition:.18s;white-space:nowrap;
    display:inline-flex;align-items:center;justify-content:center}
  .tab:hover{border-color:rgba(210,90,42,.55)}
  .tab.active{background:var(--ink);color:var(--cream);border-color:var(--ink)}

  .menu{padding:8px 18px 120px}
  .group-title{font-family:'Fraunces',serif;font-size:21px;font-weight:600;margin:22px 0 4px;color:var(--ink);
    display:flex;align-items:baseline;gap:10px}
  .group-title small{font-family:'Hanken Grotesk';font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em}
  .grid{display:block}
  .card{display:flex;gap:14px;align-items:flex-start;padding:15px 0;border-bottom:1px solid var(--line);
    cursor:pointer;transition:opacity .15s}
  .card:hover .name{color:var(--ember)}
  .card-body{flex:1;min-width:0}
  .card .name{font-weight:700;font-size:16px;margin-bottom:3px;transition:color .15s}
  .card .desc{font-size:13px;color:var(--muted);line-height:1.45}
  .card .meta{display:flex;align-items:center;gap:10px;margin-top:9px}
  .price{font-family:'Fraunces',serif;font-weight:600;font-size:16.5px;color:var(--ink)}
  .badge-opt{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--olive);
    border:1px solid rgba(111,115,69,.4);padding:3px 8px;border-radius:999px;background:rgba(111,115,69,.08)}
  .badge-sold{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#b23a2b;
    border:1px solid rgba(178,58,43,.4);padding:3px 8px;border-radius:999px;background:rgba(178,58,43,.08)}
  .card.sold{opacity:.5;cursor:default}
  .card.sold:hover .name{color:var(--ink)}
  .switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;flex:0 0 auto}
  .switch .track{width:42px;height:24px;border-radius:999px;background:rgba(60,42,30,.28);position:relative;transition:.2s;flex:0 0 auto}
  .switch.on .track{background:var(--olive)}
  .switch .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;
    transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .switch.on .knob{left:20px}
  .switch .sw-lbl{font-size:11.5px;font-weight:700;min-width:54px;text-align:right}
  .switch.on .sw-lbl{color:var(--olive)}
  .switch:not(.on) .sw-lbl{color:#b23a2b}
  .arow.sold .ico,.arow.sold .arow-nm{opacity:.5}
  .card .thumb{width:74px;height:74px;border-radius:16px;flex:0 0 auto;position:relative;overflow:hidden;
    background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(210,154,78,.35));
    border:1px solid var(--glass-bd);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
  .card .thumb span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px}
  .add-fab{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.8);border:1px solid var(--glass-bd);
    display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;color:var(--ember);font-weight:700;
    box-shadow:var(--shadow);flex:0 0 auto;align-self:center;transition:.15s}
  .card:hover .add-fab{background:var(--ember);color:#fff;border-color:var(--ember)}

  .scrim{position:fixed;inset:0;background:rgba(20,12,8,.5);z-index:75;opacity:0;pointer-events:none;
    transition:opacity .25s;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  .scrim.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:50%;transform:translateX(-50%) translateY(102%);bottom:0;width:100%;max-width:520px;
    z-index:76;background:rgba(247,239,227,.82);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
    border:1px solid var(--glass-bd);border-bottom:none;border-radius:26px 26px 0 0;box-shadow:0 -16px 50px rgba(0,0,0,.4);
    max-height:92dvh;display:flex;flex-direction:column;transition:transform .32s cubic-bezier(.22,1,.36,1),opacity .25s}
  .sheet.show{transform:translateX(-50%) translateY(0)}
  .sheet-hero{height:120px;background:linear-gradient(135deg,rgba(210,90,42,.5),rgba(210,154,78,.55));position:relative;
    border-radius:26px 26px 0 0;display:flex;align-items:flex-end;padding:16px 20px;overflow:hidden}
  .sheet-hero .emoji{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:70px;opacity:.92;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.2))}
  .sheet-hero h2{font-family:'Fraunces',serif;font-size:24px;font-weight:600;color:#fff;z-index:2;max-width:70%;
    text-shadow:0 2px 10px rgba(0,0,0,.25)}
  .sheet-close{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;border:none;
    background:rgba(255,255,255,.85);font-size:17px;line-height:1;cursor:pointer;z-index:3;color:var(--ink);
    display:flex;align-items:center;justify-content:center}
  .sheet-scroll{overflow-y:auto;overflow-x:hidden;padding:6px 20px 16px}
  .sheet-desc{font-size:13.5px;color:var(--muted);line-height:1.5;margin:14px 0 6px}
  .opt-group{margin-top:18px}
  .opt-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .opt-head h3{font-size:15px;font-weight:700}
  .opt-req{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
  .opt-req.req{background:var(--ember);color:#fff}
  .opt-req.optx{background:rgba(111,115,69,.16);color:var(--olive)}
  .opt{display:flex;align-items:center;gap:12px;padding:12px 13px;border:1px solid var(--glass-bd);border-radius:14px;
    margin-bottom:9px;cursor:pointer;transition:.15s;background:rgba(255,255,255,.4)}
  .opt:hover{border-color:rgba(210,90,42,.5)}
  .opt.sel{border-color:var(--ember);background:rgba(210,90,42,.1)}
  .opt .mark{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);flex:0 0 auto;display:flex;
    align-items:center;justify-content:center;transition:.15s}
  .opt.check .mark{border-radius:7px}
  .opt.sel .mark{border-color:var(--ember);background:var(--ember)}
  .opt.sel .mark::after{content:"✓";color:#fff;font-size:13px;font-weight:800;line-height:1}
  .opt .lbl{flex:1;font-size:14.5px;font-weight:500}
  .opt .delta{font-size:13.5px;font-weight:700;color:var(--muted)}
  .opt.sel .delta{color:var(--ember)}
  .note-in{width:100%;border:1px solid var(--glass-bd);border-radius:14px;padding:12px 13px;font-family:inherit;
    font-size:14px;margin-top:8px;resize:none;background:rgba(255,255,255,.5)}
  .note-in:focus{outline:none;border-color:var(--ember)}
  .qty-row{display:flex;align-items:center;justify-content:space-between;margin-top:20px}
  .qty{display:inline-flex;align-items:center;border:1px solid var(--glass-bd);border-radius:999px;background:rgba(255,255,255,.6);overflow:hidden}
  .qty button{width:40px;height:40px;border:none;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--ink);
    display:flex;align-items:center;justify-content:center;transition:background .12s}
  .qty button:hover{background:rgba(210,90,42,.1);color:var(--ember)}
  .qty b{font-size:18px;min-width:30px;text-align:center;font-family:'Fraunces',serif}

  .sheet-foot{padding:14px 20px max(22px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:transparent}
  .btn-primary{width:100%;border:none;border-radius:15px;background:var(--ember);color:#fff;font-family:inherit;
    font-weight:700;font-size:15.5px;padding:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    gap:10px;box-shadow:0 14px 28px -12px rgba(210,90,42,.8);transition:background .2s,transform .12s}
  .btn-primary.split{justify-content:space-between}
  .btn-primary:hover{background:var(--ember-dark)}
  .btn-primary:active{transform:scale(.99)}
  .btn-primary:disabled{background:rgba(60,42,30,.3);color:rgba(255,255,255,.8);box-shadow:none;cursor:not-allowed}

  /* Мобилно: количката е плътна, цяла страница (без прозрачност, за да не се вижда менюто отдолу). */
  .panel{position:fixed;top:0;right:50%;transform:translateX(50%) translateX(520px);width:100%;max-width:520px;
    height:100dvh;z-index:80;background:var(--cream);
    display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.22,1,.36,1)}
  .panel.show{transform:translateX(50%)}
  .panel-head{background:rgba(255,255,255,.55);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
    color:var(--ink);padding:max(18px,env(safe-area-inset-top)) 20px 18px;display:flex;align-items:center;gap:14px;
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
  .panel-head .back{background:rgba(70,50,35,.08);border:none;color:var(--ink);width:36px;height:36px;
    border-radius:50%;font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .panel-head h2{font-family:'Fraunces',serif;font-size:20px;font-weight:600}
  .panel-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 20px}
  .cart-line{padding:16px 0;border-bottom:1px solid var(--line)}
  .cart-line .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
  .cart-line .nm{font-weight:700;font-size:15.5px;min-width:0;overflow-wrap:anywhere}
  .cart-line .lt{font-family:'Fraunces',serif;font-weight:600;font-size:15.5px;white-space:nowrap;flex:0 0 auto}
  .cart-line .opts{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:5px;overflow-wrap:anywhere}
  .cart-line .ctrls{display:flex;align-items:center;gap:12px;margin-top:11px}
  .cart-line .q{display:inline-flex;align-items:center;border:1px solid var(--glass-bd);border-radius:999px;
    background:rgba(255,255,255,.6);overflow:hidden}
  .cart-line .q button{width:34px;height:34px;border:none;background:none;font-size:19px;line-height:1;cursor:pointer;
    color:var(--ink);display:flex;align-items:center;justify-content:center;transition:background .12s}
  .cart-line .q button:hover{background:rgba(210,90,42,.1);color:var(--ember)}
  .cart-line .q .qn{min-width:30px;text-align:center;font-family:'Fraunces',serif;font-size:16px}
  .cart-line .rm{margin-left:auto;background:none;border:none;color:var(--muted);font-size:12.5px;cursor:pointer;
    text-decoration:underline;font-family:inherit;white-space:nowrap;flex:0 0 auto}
  .amodal-scroll{overflow-x:hidden}
  .empty{text-align:center;padding:70px 20px;color:var(--muted)}
  .empty .big{font-size:50px;margin-bottom:14px;opacity:.5}

  .field{margin-top:16px}
  .field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:var(--ink)}
  .field input,.field select{width:100%;border:1px solid var(--glass-bd);border-radius:14px;padding:14px;
    font-family:inherit;font-size:15px;background:rgba(255,255,255,.6)}
  .field input:focus,.field select:focus{outline:none;border-color:var(--ember)}
  .time-opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .time-opt{border:1px solid var(--glass-bd);border-radius:14px;padding:13px;text-align:center;cursor:pointer;
    font-weight:600;font-size:14px;background:rgba(255,255,255,.5);transition:.15s;
    display:flex;align-items:center;justify-content:center}
  .time-opt.sel{border-color:var(--ember);background:rgba(210,90,42,.1);color:var(--ember)}
  .pay-note{display:flex;gap:11px;align-items:flex-start;background:rgba(111,115,69,.12);
    border:1px solid rgba(111,115,69,.3);border-radius:14px;padding:13px;margin-top:18px;font-size:13px;
    color:var(--ink);line-height:1.5}
  .pay-note .ic{font-size:18px;flex:0 0 auto}
  .summary{margin-top:20px;padding-top:16px;border-top:1px dashed var(--line)}
  .summary .row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:9px;color:var(--muted)}
  .summary .row.total{color:var(--ink);font-weight:700;font-size:18px;font-family:'Fraunces',serif;
    border-top:1px solid var(--line);padding-top:13px;margin-top:6px}
  /* Един формат на ред за поръчка — ползва се на „Благодарим" и в кухнята. */
  .li-opt{display:block;font-weight:400;font-size:12.5px;color:var(--muted);margin-top:2px}
  .li-note{display:block;font-weight:400;font-size:12.5px;color:var(--olive);margin-top:2px}
  .ol-line{padding:9px 0;border-bottom:1px dashed var(--line);font-size:14.5px;text-align:left}
  .ol-line:last-child{border-bottom:none}
  .orderbox{text-align:left;background:rgba(255,255,255,.55);border:1px solid var(--glass-bd);border-radius:16px;
    padding:6px 16px 14px;margin:18px 0 6px;box-shadow:var(--shadow)}
  .ob-h{font-family:'Fraunces',serif;font-weight:600;font-size:16px;padding:12px 0 4px}
  .ob-meta{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);padding:10px 0 0;
    border-top:1px solid var(--line);margin-top:8px}
  .ob-total{display:flex;justify-content:space-between;font-family:'Fraunces',serif;font-weight:700;font-size:17px;
    padding-top:10px;margin-top:8px;border-top:1px solid var(--line)}

  .confirm{padding:40px 24px 30px;text-align:center;animation:fadein .5s ease;max-width:460px;margin:0 auto}
  @keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .check-circle{width:78px;height:78px;border-radius:50%;background:var(--olive);margin:0 auto 22px;display:flex;
    align-items:center;justify-content:center;color:#fff;font-size:40px;line-height:1;box-shadow:0 16px 32px -10px rgba(111,115,69,.7);
    animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
  .confirm h2{font-family:'Fraunces',serif;font-size:26px;font-weight:600;margin-bottom:8px}
  .confirm .ordno{font-size:14px;color:var(--muted);margin-bottom:4px}
  .confirm .ordno b{color:var(--ember)}
  .vibebox{display:flex;gap:12px;align-items:center;text-align:left;background:rgba(255,255,255,.6);
    border:1px solid var(--glass-bd);border-radius:16px;padding:15px;margin:24px 0 10px;box-shadow:var(--shadow)}
  .vibebox .av{width:42px;height:42px;border-radius:12px;background:#7360f2;color:#fff;display:flex;
    align-items:center;justify-content:center;font-size:21px;line-height:1;flex:0 0 auto}
  .vibebox .av.sms{background:#2e9e5b}
  .vibebox .tx{font-size:13px;line-height:1.45}
  .vibebox .tx b{display:block;margin-bottom:2px}
  .stepper{display:flex;flex-direction:column;gap:0;text-align:left;margin:18px 4px 0}
  .step{display:flex;gap:14px;align-items:flex-start;position:relative;padding-bottom:22px}
  .step:last-child{padding-bottom:0}
  .step .dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:rgba(255,255,255,.7);
    flex:0 0 auto;z-index:2;display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;transition:.3s}
  .step:not(:last-child)::before{content:"";position:absolute;left:12px;top:26px;bottom:0;width:2px;background:var(--line)}
  .step.done .dot{background:var(--olive);border-color:var(--olive);color:#fff}
  .step.done:not(:last-child)::before{background:var(--olive)}
  .step.active .dot{border-color:var(--ember);background:#fff;color:var(--ember);
    box-shadow:0 0 0 4px rgba(210,90,42,.18);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(210,90,42,.18)}50%{box-shadow:0 0 0 7px rgba(210,90,42,.05)}}
  .step .lbl-s{padding-top:2px}
  .step .lbl-s b{font-size:14.5px;display:block}
  .step .lbl-s span{font-size:12px;color:var(--muted)}
  .step.pending .lbl-s{opacity:.45}
  .sim-btn{background:rgba(255,255,255,.35);border:1px dashed var(--muted);color:var(--ink);border-radius:13px;padding:12px;
    font-family:inherit;font-size:12.5px;cursor:pointer;width:100%;margin-top:14px;
    display:flex;align-items:center;justify-content:center;gap:6px}
  .link-btn{background:none;border:none;color:var(--ember);font-family:inherit;font-weight:700;font-size:14px;
    cursor:pointer;margin-top:18px;text-decoration:underline}

const EUR_RATE=1.95583;
const fmtNum=n=>n.toFixed(2).replace(".",",");

// try/catch — за да не чупи, ако средата блокира localStorage.

  read(){try{const r=localStorage.getItem("gb_orders");return r?JSON.parse(r):null;}catch(e){return null;}},
  write(o){try{localStorage.setItem("gb_orders",JSON.stringify(o));}catch(e){}}
};

// Единен логинг: пише в конзолата на браузъра И праща към сървъра (/api/log),
// за да виждаме целия timeline на едно място — дори при тест от телефон.
function glog(tag,data){
  try{console.log("%c[GB] "+tag,"color:#d25a2a;font-weight:700",data??"");}catch(e){}
  try{fetch("/api/log",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({tag,data}),keepalive:true});}catch(e){}
}

async function sendViber(to,text){ if(!VIBER.endpoint||!to){glog("viber:skip",{to,reason:"няма endpoint/телефон"});return;}
  try{
    const r=await fetch(VIBER.endpoint,{method:"POST",
      headers:{"Content-Type":"application/json",...(VIBER.appToken?{"x-app-token":VIBER.appToken}:{})},
      body:JSON.stringify({to,text})});
    const body=await r.text().catch(()=>"");
    glog("viber:result",{to,httpStatus:r.status,ok:r.ok,response:body.slice(0,300)});
  }
  catch(e){ glog("viber:error",{to,error:String(e)}); /* best-effort: демо нотификацията се показва дори при провал */ } }

  state.activeGroup=state.groups[0].id;

let simTimer=null;
const nowHM=()=>{const d=new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);};
// ── ЕДИН ИЗТОЧНИК НА ИСТИНА ЗА СЪДЪРЖАНИЕТО НА ПОРЪЧКАТА ──
// Едни и същи редове се ползват навсякъде: кошница, екран „Благодарим",
// Viber съобщение и изгледа на кухнята (Администрация). Така няма разминаване.

const PAY_NOTE="💳 Плащане само на място — с карта или в брой.";

// Час за вземане в човешки вид.
function pickupText(o){
  if(!o.time||o.time==="asap")return "възможно най-скоро (15–20 мин)";
  return "след "+o.time+" мин";
}
// Един ред от поръчката като чист текст: „2× Име (опции) — бел.: …".
function lineLabel(l){
  let line=l.qty+"× "+l.name;
  if(l.summary&&l.summary.length)line+=" ("+l.summary.join(", ")+")";
  if(l.note)line+=" — бел.: "+l.note;
  return line;
}
// Списък за текстово съобщение (Viber/SMS).
function orderLinesText(o){return (o.lines||[]).map(l=>"• "+lineLabel(l)).join("\n");}
// Същият списък за HTML (екран на клиента и кухнята).
function orderLinesHTML(o){
  return (o.lines||[]).map(l=>{
    let h=`<b>${l.qty}× ${l.name}</b>`;
    if(l.summary&&l.summary.length)h+=` <span class="li-opt">${l.summary.join(", ")}</span>`;
    if(l.note)h+=`<span class="li-note">📝 ${l.note}</span>`;
    return `<div class="ol-line">${h}</div>`;
  }).join("");
}

// Канал + кратък етикет за toast/лога.
// Линк към страницата със статуса на конкретната поръчка.
function statusLink(o){return location.origin+"/?track="+o.docID;}
function statusInfo(s){
  // Известията минават през Viber (реалният канал).
  // Статус 2 („приготвя се") НЕ праща съобщение — само сменя статуса.
  if(s===1)return{channel:"viber",toast:"Получихме поръчката ти ✅"};
  if(s===3)return{channel:"viber",toast:"Готова за вземане ✅ Заповядай!"};
  return null;
}
// Пълният текст, който РЕАЛНО се изпраща (и се показва на клиента 1:1).
function messageFor(o,s){
  if(s===1){
    return [
      "Здравей"+(o.name?", "+o.name:"")+"! 🍽️",
      "Получихме поръчката ти #"+o.docID+".",
      "",
      "🧾 Поръчано:",
      orderLinesText(o),
      "",
      "Общо: "+money(o.total),
      "⏰ За вземане: "+pickupText(o),
      PAY_NOTE,
      "",
      "🔗 Проследи статуса: "+statusLink(o),
    ].join("\n");
  }
  if(s===3){
    return [
      "Поръчка #"+o.docID+" е ГОТОВА за вземане ✅",
      "⏰ Заповядай да я вземеш ("+pickupText(o)+").",
      PAY_NOTE,
      "",
      "🔗 Детайли: "+statusLink(o),
    ].join("\n");
  }
  return "";
}
function toast(e){const wrap=document.getElementById("toasts");if(!wrap)return;
  const el=document.createElement("div");el.className="toast "+e.channel;
  el.innerHTML=`<div class="t-av">${e.channel==='sms'?'✉':'V'}</div><div class="t-tx"><b>${e.channel==='sms'?'SMS':'Viber'} → #${e.docID}</b>${e.toast}</div>`;
  wrap.appendChild(el);requestAnimationFrame(()=>el.classList.add("show"));
  setTimeout(()=>{el.classList.remove("show");setTimeout(()=>el.remove(),320);},4200);}
const STATUS_NAME=["","приета","приготвя се","готова за вземане","взета"];
function setStatus(docID,s){const o=state.orders.find(x=>x.docID===docID);if(!o)return;o.status=s;
  const inf=statusInfo(s);
  glog("order:status",{docID,status:s,statusName:STATUS_NAME[s]||String(s),channel:inf?inf.channel:"—"});
  if(inf){
    // text = точният текст, който се праща (показва се 1:1 в лога и на екрана).
    const e={channel:inf.channel,toast:inf.toast,text:messageFor(o,s),docID,time:nowHM()};
    o.notifs.push(e);toast(e);
    if(o.phone){
      const phone=normalizePhone(o.phone);
      glog("notify:viber",{docID,to:phone,text:e.text});
      sendViber(phone,e.text);
    } else {
      glog("notify:viber:skip",{docID,reason:"няма телефон"});
    }
  }
  persist();render();}
function trackOrder(docID){state.tracking=true;state.activeOrderId=docID;state.view="confirm";state.trackInput=false;state.trackErr="";render();}
function advanceOrder(docID){const o=state.orders.find(x=>x.docID===docID);if(o&&o.status<4)setStatus(docID,o.status+1);}
function runAutoSim(docID){state.autoSim=true;render();const steps=[2,3];let i=0;
  const next=()=>{if(!state.autoSim||state.activeOrderId!==docID)return;
    if(i>=steps.length){state.autoSim=false;render();return;}
    setStatus(docID,steps[i]);i++;simTimer=setTimeout(next,2000);};
  simTimer=setTimeout(next,1700);}
function stopSim(){state.autoSim=false;clearTimeout(simTimer);}

function render(){
  const sy=window.scrollY;
  const grab=s=>{const e=document.querySelector(s);return e?e.scrollTop:0;};
  const psT=grab(".panel-scroll"),ssT=grab(".sheet-scroll"),asT=grab(".amodal-scroll");
  if(state.mode==="admin"){root.innerHTML=demobar()+`<div class="app">`+adminView()+`</div>`+adminModal();bindCommon();bindAdmin();}
  else if(state.view==="confirm"){root.innerHTML=demobar()+`<div class="app">`+confirmView()+`</div>`;bindCommon();bindConfirm();}
  else{root.innerHTML=demobar()+`<div class="app">`+header()+
    `<div class="layout"><div class="main">`+trackBanner()+tabs()+menu()+`</div>`+cartPanel()+`</div>`+
    floatCart()+sheet()+`</div>`;bindCommon();bindClient();}
  document.body.classList.toggle("cart-open",state.mode!=="admin"&&(state.view==="cart"||state.view==="checkout"));
  window.scrollTo(0,sy);
  const set=(s,v)=>{const e=document.querySelector(s);if(e)e.scrollTop=v;};
  set(".panel-scroll",psT);set(".sheet-scroll",ssT);set(".amodal-scroll",asT);
  requestAnimationFrame(()=>{window.scrollTo(0,sy);set(".panel-scroll",psT);set(".sheet-scroll",ssT);set(".amodal-scroll",asT);});
}

  const last=o.notifs&&o.notifs.length?o.notifs[o.notifs.length-1]:null;
  const logHtml=(o.notifs||[]).map(n=>`<div class="nlog-item"><span class="ch ${n.channel}">${n.channel==='viber'?'Viber':'SMS'}</span>
     <span class="nt">${n.toast||n.text}</span><span class="tm">${n.time}</span></div>`).join("");
  const orderBox=(o.lines&&o.lines.length)?`<div class="orderbox">
      <div class="ob-h">🧾 Твоята поръчка</div>
      ${orderLinesHTML(o)}
      <div class="ob-meta"><span>⏰ За вземане: ${pickupText(o)}</span><span>${PAY_NOTE}</span></div>
      <div class="ob-total"><span>Общо</span><span>${money(o.total)}</span></div></div>`:"";
  return `<div class="confirm"><div class="confirm-top">Грил &amp; Бистро</div>
    <div class="check-circle">${done?'🎉':'✓'}</div>
    <h2>${done?'Поръчката е готова!':'Благодарим!'}</h2>
    <div class="ordno">Номер на поръчка: <b>#${o.docID}</b></div>
    <div class="ordno">за ${o.name||'клиент'}</div>
    ${orderBox}
    <div class="vibebox"><div class="av ${last&&last.channel==='sms'?'sms':''}">${last&&last.channel==='sms'?'✉':'V'}</div>
      <div class="tx"><b>${last?((last.channel==='sms'?'SMS':'Viber')+' до '+(o.phone||'клиента')):'Известие'}</b>${last?(last.toast||last.text):'Ще получиш Viber/SMS при промяна на статуса.'}</div></div>
    <div class="stepper">${stepsHtml}</div>
    ${o.notifs&&o.notifs.length?`<div class="nlog"><div class="nlog-h">Изпратени известия</div>${logHtml}</div>`:""}
    <div class="trackcode">Код за проследяване: <b>#${o.docID}</b><span>Запази го — линкът към статуса е и в твоето Viber/SMS известие, така че можеш да се върнеш по всяко време.</span></div>
    ${!done?`<button class="btn-primary" id="autoSim" ${state.autoSim?'disabled':''} style="margin-top:18px">
        <span>${state.autoSim?'⏳ Симулира се…':'▶ Пусни демо на целия път'}</span></button>
      <button class="sim-btn" id="sim" ${state.autoSim?'disabled':''}>→ Само една стъпка напред</button>`:""}
    ${state.tracking?`<button class="link-btn" id="backMenu">← Обратно към менюто</button>`:`<button class="link-btn" id="newOrder">Нова поръчка</button>`}</div>`;
}

/* ---------------- ADMIN ---------------- */
function adminView(){
  return `<div class="admin"><div class="admin-head"><h1>Администрация</h1>
      <p>Грил &amp; Бистро · управление на менюто и поръчките</p></div>
    <div class="admin-wrap">
      <div class="admin-tabs">
        <button class="${state.adminTab==='products'?'on':''}" data-atab="products">Продукти и комбинации</button>
        <button class="${state.adminTab==='orders'?'on':''}" data-atab="orders">Входящи поръчки${state.orders.filter(o=>o.status<3).length?' ('+state.orders.filter(o=>o.status<3).length+')':''}</button>
      </div>
      ${state.adminTab==='products'?adminProducts():adminOrders()}
    </div></div>`;
}
function adminProducts(){
  let out=`<div class="info-card"><span class="ic">ℹ️</span><div>
    <b>Имената, цените и категориите идват от Янак</b> (синхронизират се автоматично).
    Тук управлявате <b>комбинациите</b> и можете бързо да <b>спрете/пуснете</b> ястие, ако се изчерпи.</div></div>`;
  out+=`<div class="grid-admin">`;
  state.items.forEach(it=>{const has=(it.modifiers||[]).length>0;const on=it.available!==false;
    out+=`<div class="arow ${on?'':'sold'}" data-edit="${it.id}"><div class="ico">${it.emoji||"🍽️"}</div>
      <div class="arow-body"><div class="arow-nm">${it.name}</div>
        <div class="arow-sub">${money(it.basicPrice)} · ${has?(it.modifiers.length+' групи опции'):'без комбинации'}</div></div>
      <div class="switch ${on?'on':''}" data-toggle="${it.id}"><span class="sw-lbl">${on?'Наличен':'Изчерпан'}</span>
        <span class="track"><span class="knob"></span></span></div>
      <span class="chev">›</span></div>`;});
  return out+`</div>`;
}
function adminOrders(){
  if(!state.orders.length) return `<div class="empty"><div class="big">📋</div>Все още няма поръчки.<br>Направи една от изгледа „Клиент", за да се появи тук.</div>`;
  const labels=["","Приета","Приготвя се","Готова за вземане","Взета"];
  const pillCls=["","s1","s2","s3","s4"];
  const advText=["","▶ Започни приготвяне","✓ Маркирай готова","📦 Маркирай взета",""];
  return state.orders.map(o=>`<div class="ordcard">
    <div class="oh"><b>#${o.docID}</b><span style="font-family:'Fraunces',serif;font-weight:600">${money(o.total)}</span></div>
    <div class="who">${o.name||'клиент'} · ${o.phone||'—'} · ⏰ ${pickupText(o)}</div>
    <div class="items">${orderLinesHTML(o)}</div>
    <div class="statline"><span class="pill ${pillCls[o.status]}">${labels[o.status]}</span>
      ${o.status<4?`<button class="adv" data-adv="${o.docID}">${advText[o.status]}</button>`:`<span style="font-size:12px;color:var(--muted);margin-left:auto">✓ завършена</span>`}
      ${o.status>=3&&o.status<4?`<span class="ord-notified">✓ клиентът получи нотификация „готова за вземане"</span>`:''}</div></div>`).join("");
}

/* admin editor for combinations */
function openEditor(id){const it=state.items.find(x=>x.id===id);
  state.adminDraft={productId:id,name:it.name,emoji:it.emoji,basicPrice:it.basicPrice,
    modifiers:JSON.parse(JSON.stringify(it.modifiers||[]))};render();
  requestAnimationFrame(()=>{document.getElementById("ascrim")?.classList.add("show");document.getElementById("amodal")?.classList.add("show");});}
function closeEditor(){document.getElementById("ascrim")?.classList.remove("show");document.getElementById("amodal")?.classList.remove("show");
  setTimeout(()=>{state.adminDraft=null;render();},250);}
function draftAddGroup(){state.adminDraft.modifiers.push({key:uid(),title:"Нова група",required:false,min:0,max:5,options:[{id:uid(),name:"",delta:0}]});render();keepEditor();}
function draftRemoveGroup(gi){state.adminDraft.modifiers.splice(gi,1);render();keepEditor();}
function draftAddOption(gi){state.adminDraft.modifiers[gi].options.push({id:uid(),name:"",delta:0});render();keepEditor();}
function draftRemoveOption(gi,oi){state.adminDraft.modifiers[gi].options.splice(oi,1);render();keepEditor();}
function draftSetType(gi,val){const g=state.adminDraft.modifiers[gi];if(val==="single"){g.required=true;g.min=1;g.max=1;}else{g.required=false;g.min=0;g.max=5;}render();keepEditor();}
function keepEditor(){document.getElementById("ascrim")?.classList.add("show");document.getElementById("amodal")?.classList.add("show");}
function saveEditor(){const d=state.adminDraft;const it=state.items.find(x=>x.id===d.productId);
  // изчистваме празни опции
  d.modifiers.forEach(g=>{g.options=g.options.filter(o=>o.name.trim()!=="");});
  it.modifiers=d.modifiers.filter(g=>g.options.length>0);closeEditor();}

function adminModal(){
  const d=state.adminDraft;if(!d)return `<div class="scrim" id="ascrim"></div>`;
  let groups="";d.modifiers.forEach((g,gi)=>{
    const type=(g.required&&g.max===1)?"single":"multi";
    groups+=`<div class="gcard">
      <div class="gcard-top">
        <input class="gtitle" data-gi="${gi}" value="${g.title.replace(/"/g,'&quot;')}" placeholder="Име на групата">
        <select class="gtype" data-gi="${gi}">
          <option value="single" ${type==='single'?'selected':''}>избор на 1 (задължит.)</option>
          <option value="multi" ${type==='multi'?'selected':''}>няколко (по избор)</option></select>
        <button class="del" data-delg="${gi}">🗑</button></div>
      ${g.options.map((o,oi)=>`<div class="orow">
        <input class="onm" data-gi="${gi}" data-oi="${oi}" value="${o.name.replace(/"/g,'&quot;')}" placeholder="Опция (напр. Пържени картофи)">
        <div class="pricew">+<input class="odelta" data-gi="${gi}" data-oi="${oi}" type="number" step="0.10" value="${o.delta}">
          <span>лв</span></div><button class="del" data-delo="${gi}" data-oi2="${oi}">✕</button></div>`).join("")}
      <button class="addbtn" data-addo="${gi}">+ Добави опция</button></div>`;});
  return `<div class="scrim show" id="ascrim"></div>
    <div class="amodal" id="amodal">
      <div class="amodal-head"><div><h2>${d.emoji} ${d.name}</h2>
        <div class="ro">Име и цена (${money(d.basicPrice)}) се управляват в Янак · тук са комбинациите</div></div>
        <button class="sheet-close" id="aclose" style="position:static">✕</button></div>
      <div class="amodal-scroll">${groups||`<p style="color:var(--muted);font-size:13.5px;padding:8px 0">Този продукт няма комбинации. Добави група, за да предложиш избор на гарнитура или добавки.</p>`}
        <button class="addbtn group" id="addg">+ Добави нова група опции</button></div>
      <div class="amodal-foot"><button class="btn-ghost" id="acancel">Отказ</button>
        <button class="btn-primary compact" id="asave"><span>Запази промените</span></button></div></div>`;
}

/* ---------------- BINDINGS ---------------- */
function bindCommon(){
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{stopSim();state.mode=b.dataset.mode;render();});
}
function bindClient(){
  document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{state.activeGroup=+t.dataset.g;
    document.getElementById("grp-"+t.dataset.g)?.scrollIntoView({behavior:"smooth",block:"start"});
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));t.classList.add("active");});
  document.querySelectorAll(".card").forEach(c=>c.onclick=()=>{if(c.dataset.sold==="true")return;const it=state.items.find(i=>i.id===+c.dataset.item);if(it)openItem(it);});
  const oc=document.getElementById("openCart");if(oc)oc.onclick=()=>{state.view="cart";render();};
  const oc2=document.getElementById("openCart2");if(oc2)oc2.onclick=()=>{state.view="cart";render();};
  const cs=document.getElementById("closeSheet");if(cs)cs.onclick=closeSheet;
  const scrim=document.getElementById("scrim");if(scrim)scrim.onclick=closeSheet;
  document.querySelectorAll(".opt").forEach(o=>o.onclick=()=>toggleOpt(o.dataset.grp,o.dataset.opt,o.dataset.single==="true"));
  const qm=document.getElementById("qminus");if(qm)qm.onclick=()=>{state.modalQty=Math.max(1,state.modalQty-1);updateModalFooter();};
  const qp=document.getElementById("qplus");if(qp)qp.onclick=()=>{state.modalQty++;updateModalFooter();};
  const note=document.getElementById("note");if(note)note.oninput=e=>{state.modalNote=e.target.value;};
  const ac=document.getElementById("addCart");if(ac)ac.onclick=addToCart;
  const pb=document.getElementById("panelBack");if(pb)pb.onclick=()=>{state.view=(state.view==="checkout")?"cart":"menu";render();};
  document.querySelectorAll("[data-inc]").forEach(b=>b.onclick=()=>changeQtyCart(+b.dataset.inc,1));
  document.querySelectorAll("[data-dec]").forEach(b=>b.onclick=()=>changeQtyCart(+b.dataset.dec,-1));
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>removeLine(+b.dataset.rm));
  const tc=document.getElementById("toCheckout");if(tc)tc.onclick=()=>{state.view="checkout";render();};
  const fn=document.getElementById("f-name");if(fn)fn.oninput=e=>{state.order.name=e.target.value;updatePlace();};
  const fp=document.getElementById("f-phone");if(fp)fp.oninput=e=>{state.order.phone=e.target.value;updatePlace();};
  document.querySelectorAll(".time-opt").forEach(t=>t.onclick=()=>{state.order.time=t.dataset.time;render();});
  const pl=document.getElementById("placeBtn");if(pl)pl.onclick=placeOrder;
  document.querySelectorAll("[data-track]").forEach(b=>b.onclick=()=>trackOrder(+b.dataset.track));
  const tt=document.getElementById("trackToggle");if(tt)tt.onclick=()=>{state.trackInput=true;render();};
  const tn=document.getElementById("trackNum");if(tn)tn.oninput=e=>{state.trackInputVal=e.target.value;};
  const tg=document.getElementById("trackGo");if(tg)tg.onclick=()=>{const n=parseInt(state.trackInputVal,10);
    const o=state.orders.find(x=>x.docID===n);
    if(o){trackOrder(n);}else{state.trackErr="Поръчка #"+(state.trackInputVal||"?")+" не е намерена на това устройство. В реалната версия линкът от известието я зарежда от Янак.";render();}};
}
function bindConfirm(){
  const o=state.orders.find(x=>x.docID===state.activeOrderId);
  const sim=document.getElementById("sim");if(sim)sim.onclick=()=>{if(o&&o.status<3)setStatus(o.docID,o.status+1);};
  const auto=document.getElementById("autoSim");if(auto)auto.onclick=()=>{if(o)runAutoSim(o.docID);};
  const bm=document.getElementById("backMenu");if(bm)bm.onclick=()=>{state.tracking=false;state.view="menu";render();};
  const no=document.getElementById("newOrder");if(no)no.onclick=()=>{stopSim();state.cart=[];state.view="menu";
    state.order={name:"",phone:"",time:"asap"};state.activeOrderId=null;state.tracking=false;persist();render();};
}
function bindAdmin(){
  document.querySelectorAll("[data-atab]").forEach(b=>b.onclick=()=>{state.adminTab=b.dataset.atab;render();});
  document.querySelectorAll("[data-edit]").forEach(r=>r.onclick=()=>openEditor(+r.dataset.edit));
  document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=e=>{e.stopPropagation();
    const it=state.items.find(x=>x.id===+b.dataset.toggle);it.available=it.available===false;render();});
  document.querySelectorAll("[data-adv]").forEach(b=>b.onclick=()=>advanceOrder(+b.dataset.adv));
  // editor
  const as=document.getElementById("ascrim");if(as)as.onclick=closeEditor;
  const acl=document.getElementById("aclose");if(acl)acl.onclick=closeEditor;
  const acan=document.getElementById("acancel");if(acan)acan.onclick=closeEditor;
  const asv=document.getElementById("asave");if(asv)asv.onclick=saveEditor;
  const addg=document.getElementById("addg");if(addg)addg.onclick=draftAddGroup;
  document.querySelectorAll("[data-delg]").forEach(b=>b.onclick=()=>draftRemoveGroup(+b.dataset.delg));
  document.querySelectorAll("[data-addo]").forEach(b=>b.onclick=()=>draftAddOption(+b.dataset.addo));
  document.querySelectorAll("[data-delo]").forEach(b=>b.onclick=()=>draftRemoveOption(+b.dataset.delo,+b.dataset.oi2));
  // live edits (no re-render to keep focus)
  document.querySelectorAll(".gtitle").forEach(i=>i.oninput=e=>{state.adminDraft.modifiers[+e.target.dataset.gi].title=e.target.value;});
  document.querySelectorAll(".gtype").forEach(s=>s.onchange=e=>draftSetType(+e.target.dataset.gi,e.target.value));
  document.querySelectorAll(".onm").forEach(i=>i.oninput=e=>{state.adminDraft.modifiers[+e.target.dataset.gi].options[+e.target.dataset.oi].name=e.target.value;});
  document.querySelectorAll(".odelta").forEach(i=>i.oninput=e=>{state.adminDraft.modifiers[+e.target.dataset.gi].options[+e.target.dataset.oi].delta=parseFloat(e.target.value)||0;});
}
function updatePlace(){const o=state.order;const ready=o.name.trim()&&o.phone.trim().length>=6;
  const btn=document.getElementById("placeBtn");if(btn){btn.disabled=!ready;btn.querySelector("span").textContent=ready?'Изпрати поръчката':'Попълни име и телефон';}}

boot();
</script>
</body>
</html>
