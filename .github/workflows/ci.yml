name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check server
        run: node --check local-server.mjs

      - name: Syntax check client script
        run: |
          node -e "
            const fs=require('fs');
            const h=fs.readFileSync('menu-prototip_8.html','utf8');
            const m=h.match(/<script>([\s\S]*?)<\\/script>/);
            if(!m) throw new Error('no script block');
            fs.writeFileSync('_ci.js',m[1]);
          "
          node --check _ci.js
          rm _ci.js

      - name: Start server and health check
        run: |
          node local-server.mjs &
          sleep 2
          curl -fsS http://127.0.0.1:3000/healthz | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:3000/api/config | grep -q demoMode
